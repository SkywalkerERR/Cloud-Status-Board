---
- name: Configure status-board VM
  hosts: app
  become: true
  vars:
    app_dir: /opt/status-board

  tasks:
    - name: Wait for apt to be free
      ansible.builtin.shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
      changed_when: false

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Install Docker from Ubuntu packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker is started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Sync compose and nginx
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        owner: ubuntu
        group: ubuntu
      loop:
        - { src: "{{ playbook_dir }}/../../docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "{{ playbook_dir }}/../../nginx/", dest: "nginx/" }

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/app"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Sync app sources (without .venv)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../app/{{ item }}"
        dest: "{{ app_dir }}/app/{{ item }}"
        owner: ubuntu
        group: ubuntu
      loop:
        - app.py
        - requirements.txt
        - Dockerfile
        - .dockerignore