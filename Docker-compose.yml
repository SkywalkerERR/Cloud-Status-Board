services:
  app:
    build: ./app
    environment:
      APP_ENV: compose
    expose:
      - "8000"
    # порт 8000 наружу не публикуем — доступ только через nginx

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app