apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-board
  labels:
    app: status-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: status-board
  template:
    metadata:
      labels:
        app: status-board
    spec:
      containers:
        - name: status-board
          image: status-board:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: k8s
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"